<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Confirmation page displaying details submitted through the PhotoGallery visitor feedback form.">
    <meta name="author" content="Inefable KOUMBA">
    
    <title>PhotoGallery | Feedback Received</title>
    
    <!-- Favicon -->
    <link rel="icon" href="images/favicon.ico" type="image/x-icon">
    
    <!-- Fonts & CSS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/main.css">
    
    <!-- ES Module Script -->
    <script type="module" src="scripts/thankyou.js"></script>
</head>

<body>

    <header>
        <div class="header-container">
            <a href="index.html" class="brand-logo">
                <div class="logo-icon">P</div>
                <div class="brand-title">Photo<span>Gallery</span></div>
            </a>
            
            <button id="menu-toggle" aria-label="Toggle navigation menu">☰</button>
            
            <nav>
                <ul class="nav-menu">
                    <li><a href="index.html" class="nav-link">Gallery Home</a></li>
                    <li><a href="collections.html" class="nav-link">Favorites & Boards</a></li>
                    <li><a href="about.html" class="nav-link">Story & Feedback</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>

        <section class="form-container" style="max-width: 700px;">
            <div style="text-align: center; margin-bottom: 25px;">
                <div style="font-size: 3rem; margin-bottom: 10px;">🎉</div>
                <h1 style="font-family: var(--font-heading); font-size: 2.2rem; color: var(--accent-amber);">Thank You for Your Feedback!</h1>
                <p style="color: var(--text-muted);">Your submission has been processed. Here is a summary of your form entries:</p>
            </div>

            <!-- Display Form Data -->
            <div id="form-results">
                <!-- Dynamically populated via thankyou.js -->
            </div>

            <div style="text-align: center; margin-top: 30px;">
                <a href="index.html" class="submit-btn" style="text-decoration: none; display: inline-block;">Return to Photo Gallery</a>
            </div>
        </section>

    </main>

    <footer>
        <div class="footer-links">
            <a href="index.html">Home</a>
            <a href="collections.html">Collections</a>
            <a href="about.html">About & Feedback</a>
            <a href="attributions.html">Attributions</a>
        </div>
        <p>&copy; <span id="currentyear"></span> | Inefable KOUMBA | Republic of Congo</p>
        <p><span id="lastModified"></span></p>
    </footer>

</body>

</html>
