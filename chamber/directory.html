<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timbuktu Chamber of Commerce Directory</title>
    <meta name="description" content="Timbuktu Chamber of Commerce member directory and business listings.">
    <meta name="author" content="Inefable KOUMBA">

    <!-- Favicon -->
    <link rel="icon" href="images/favicon.png" type="image/png">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://inefablekoumba.github.io/wdd231/chamber/directory.html">
    <meta property="og:title" content="Timbuktu Chamber of Commerce Directory">
    <meta property="og:description"
        content="Discover local businesses and services in Timbuktu. Join our chamber today!">
    <meta property="og:image" content="https://inefablekoumba.github.io/wdd231/chamber/images/logo.png">

    <!-- CSS -->
    <link rel="stylesheet" href="css/normalize.css">
    <link rel="stylesheet" href="css/small.css">
    <link rel="stylesheet" href="css/larger.css">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;700&family=Roboto:wght@400;700&display=swap"
        rel="stylesheet">

    <!-- Scripts -->
    <script src="scripts/main.js" defer></script>
    <script src="scripts/directory.js" defer></script>
</head>

<body>
    <header>
        <div class="logo-container">
            <img src="images/logo.png" alt="Timbuktu Chamber Logo" width="60" height="60">
            <h1>Timbuktu Chamber of Commerce</h1>
        </div>
        <button id="menu-btn" aria-label="Menu">☰</button>
        <nav>
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="directory.html" class="active">Directory</a></li>
                <li><a href="#">Join</a></li>
                <li><a href="#">Discover</a></li>
                <li><button id="dark-mode-btn" aria-label="Toggle Dark Mode">🌓</button></li>
            </ul>
        </nav>
    </header>

    <main>
        <h2>Directory</h2>

        <div class="view-toggle">
            <button id="grid-view-btn" class="active" aria-label="Grid View">Grid</button>
            <button id="list-view-btn" aria-label="List View">List</button>
        </div>

        <div id="members-container">
            <!-- Member cards injected here by directory.js -->
        </div>
    </main>

    <footer>
        <div class="footer-info">
            <p><strong>Timbuktu Chamber of Commerce</strong></p>
            <p>10 Rue De La Paix</p>
            <p>Timbuktu, Mali 999</p>
            <p>info@timbuktucc.org</p>
            <p>(223) 555-2300</p>
        </div>

        <div class="social-links">
            <a href="https://youtube.com" aria-label="YouTube" target="_blank">📺</a>
            <a href="https://twitter.com" aria-label="Twitter" target="_blank">🐦</a>
            <a href="https://linkedin.com" aria-label="LinkedIn" target="_blank">💼</a>
        </div>

        <div class="dev-info">
            <p>WDD231 Class Project</p>
            <p>Inefable KOUMBA</p>
            <p>&copy; <span id="currentyear"></span> Timbuktu Chamber of Commerce</p>
            <p id="lastModified"></p>
        </div>
    </footer>

</html>
